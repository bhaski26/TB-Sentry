[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tb-sentry"
version = "0.1.0"
description = "Explainable deep learning system for tuberculosis screening from chest X-rays."
requires-python = ">=3.11,<3.12"

[tool.setuptools.packages.find]
where = ["src"]