[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tb-sentry"
version = "0.1.0"
description = "Explainable deep learning system for tuberculosis screening from chest X-rays."
requires-python = ">=3.11,<3.12"
dependencies = [
    "torch>=2.0",
    "torchvision>=0.15",
    "numpy>=1.24",
    "scikit-learn>=1.3",
    "Pillow>=9.5",
    "matplotlib>=3.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
]
audit = [
    "ImageHash>=4.3",
]

[tool.setuptools.packages.find]
where = ["src"]
